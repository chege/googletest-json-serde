name: CI

on:
  pull_request:
  push:
    branches: [ main, "*-dev" ]

permissions:
  contents: read  # least-privilege

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # Disable incremental compilation for CI
  CARGO_PROFILE_DEV_DEBUG: 0  # Reduce debug info in dev builds

jobs:
  commitlint:
    name: Commit messages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test commit message policy
        run: node --test scripts/test-commitlint.cjs
      - name: Check every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
          if [[ -z "$commits" ]]; then
            echo "::error::No PR commits found to lint."
            exit 1
          fi
          while read -r commit; do
            echo "Checking commit $commit"
            git log -1 --format=%B "$commit" | npx --no -- commitlint
          done <<< "$commits"

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.89.0

  guardrail-tests:
    name: Guardrail tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fmt"
          save-if: false  # Format job doesn't need to save cache
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable"

      - name: clippy (stable, deny warnings)
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV 1.89.0 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
      - name: Build on MSRV (locked)
        run: cargo build --all-features --locked

  docs:
    name: Docs build
    needs: [format, clippy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable"
      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  minimal-versions:
    name: Minimal dependency versions
    needs: [format, clippy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nightly"
      - name: Generate minimal lockfile
        run: cargo +nightly generate-lockfile -Z minimal-versions
      - name: Build with minimal versions
        run: cargo +nightly build --all-features --locked

  coverage:
    name: Coverage (llvm-cov)
    needs: [format, clippy, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-coverage"
      - name: Run coverage gate
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 90

  test:
    name: Tests (stable)
    needs: [format, clippy, msrv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-${{ matrix.os }}"
      - name: Build (locked)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --all-features --locked
      - name: Run unit + integration tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all-features -- --nocapture

  pr-gate:
    name: pr-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [commitlint, audit, guardrail-tests, format, clippy, msrv, docs, minimal-versions, coverage, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/check-pr-gate.sh

  main-gate:
    name: main-gate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [audit, guardrail-tests, format, clippy, msrv, docs, minimal-versions, coverage, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/check-pr-gate.sh